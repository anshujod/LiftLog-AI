name: Frontend CI

on:
  pull_request:
    paths:
      - "web/**"
      - "api/**"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - "api/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  api-types:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Configure backend env
        run: cp api/.env.example api/.env
        working-directory: .

      - name: Start backend
        run: docker compose up -d --build
        working-directory: .

      - name: Wait for backend health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "backend is up"
              exit 0
            fi
            sleep 2
          done
          echo "backend did not become healthy in time"
          docker compose logs
          exit 1
        working-directory: .

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Regenerate API types
        run: npm run gen:api

      - name: Fail if generated types drifted from the backend schema
        run: |
          if ! git diff --quiet -- lib/api/schema.d.ts; then
            echo "lib/api/schema.d.ts is out of date. Run 'npm run gen:api' in web/ and commit the result."
            git diff -- lib/api/schema.d.ts
            exit 1
          fi

      - name: Generate Next.js route types
        run: npx next typegen

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Stop backend
        if: always()
        run: docker compose down
        working-directory: .

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure backend env
        run: cp api/.env.example api/.env

      - name: Start backend
        run: docker compose up -d --build

      - name: Wait for backend health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "backend is up"
              exit 0
            fi
            sleep 2
          done
          echo "backend did not become healthy in time"
          docker compose logs
          exit 1

      - name: Run database migrations
        # The api image boots straight into uvicorn (migrations are a separate
        # step in local dev too — see `make migrate`), so a fresh CI volume
        # has no tables until we migrate explicitly.
        run: docker compose exec -T api uv run alembic upgrade head

      - name: Seed exercise library
        # Credentials come from the api service's own DATABASE_URL — never
        # hardcode them in the workflow, secret scanners flag that.
        run: >
          docker compose exec -T api uv run python -c
          "import os; from sqlalchemy import create_engine; from sqlalchemy.orm import sessionmaker;
          from seeds.seed import run_seed;
          e = create_engine(os.environ['DATABASE_URL']);
          S = sessionmaker(bind=e);
          s = S(); run_seed(s); s.commit(); print('seeded')"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: web

      - name: Production build
        run: npm run build
        working-directory: web

      - name: Run e2e logging loop (mobile viewport)
        run: npm run e2e
        working-directory: web
        env:
          CI: true

      - name: Stop backend
        if: always()
        run: docker compose down
