name: Frontend CI

on:
  pull_request:
    paths:
      - "web/**"
      - "api/**"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - "api/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  api-types:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Configure backend env
        run: cp api/.env.example api/.env
        working-directory: .

      - name: Start backend
        run: docker compose up -d --build
        working-directory: .

      - name: Wait for backend health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "backend is up"
              exit 0
            fi
            sleep 2
          done
          echo "backend did not become healthy in time"
          docker compose logs
          exit 1
        working-directory: .

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Regenerate API types
        run: npm run gen:api

      - name: Fail if generated types drifted from the backend schema
        run: |
          if ! git diff --quiet -- lib/api/schema.d.ts; then
            echo "lib/api/schema.d.ts is out of date. Run 'npm run gen:api' in web/ and commit the result."
            git diff -- lib/api/schema.d.ts
            exit 1
          fi

      - name: Generate Next.js route types
        run: npx next typegen

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Stop backend
        if: always()
        run: docker compose down
        working-directory: .
