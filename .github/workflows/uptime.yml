name: Uptime

# Pings the production API's health endpoint on a schedule. The timeout is
# generous on purpose: a cold platform start can take a minute, and that is
# not an outage. A non-200 (or no response at all) fails the run, which
# notifies through the repository's Actions failure alerts.
#
# Runs every 10 minutes, which also keeps a free-tier service from idling
# to sleep between checks.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check production health
        run: |
          url="${HEALTH_URL:-https://liftlog-ai.onrender.com/health}"
          echo "GET $url"
          body="$(curl -sf --max-time 120 "$url")"
          echo "$body"
          echo "$body" | grep -q '"status"[[:space:]]*:[[:space:]]*"ok"' \
            || (echo "health check failed" && exit 1)
