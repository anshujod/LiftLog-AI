services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: liftlog
      POSTGRES_PASSWORD: liftlog
      POSTGRES_DB: liftlog
    ports:
      - "5434:5432"
    volumes:
      - liftlog_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liftlog -d liftlog"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    # Local development keeps --reload; production uses the image CMD
    # (start.sh: migrate, then serve without reload).
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - ./api/.env
    environment:
      DATABASE_URL: postgresql+psycopg://liftlog:liftlog@db:5432/liftlog
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
      - liftlog_api_venv:/app/.venv
    depends_on:
      db:
        condition: service_healthy

volumes:
  liftlog_db_data:
  liftlog_api_venv:
